services:
  sync:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
      - ./gnupg:/gnupg

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./data/repo:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
